[project]
name = "oaa-backend"
version = "0.1.0"
description = "OneAboveAll (OAA) — Autonomous SRE Control Plane & Management Platform (backend)"
readme = "../context.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.155.0",
    "fastmcp>=2",
    "httpx>=0.28.1",
    "langchain-core>=1.6.12",
    "langchain-google-genai>=4.4.2",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.16",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "pydantic>=2",
    "pydantic-settings>=2.16.1",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.uv]
package = false
